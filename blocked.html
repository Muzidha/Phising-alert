<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Akses Diblokir - PhishShield</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    body {
      background-color: #1a1a1a;
      color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
    }
    .card {
      background-color: #262626;
      border-top: 6px solid #e53e3e;
      border-radius: 8px;
      max-width: 520px;
      width: 100%;
      padding: 32px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
      text-align: center;
    }
    .icon {
      font-size: 54px;
      margin-bottom: 16px;
    }
    h1 {
      font-size: 24px;
      color: #fc8181;
      margin-bottom: 12px;
    }
    p {
      color: #cbd5e0;
      font-size: 15px;
      line-height: 1.5;
      margin-bottom: 20px;
    }
    .target-url {
      background-color: #1a1a1a;
      padding: 10px;
      border-radius: 6px;
      font-family: monospace;
      color: #f6ad55;
      word-break: break-all;
      margin-bottom: 24px;
      border: 1px solid #4a5568;
    }
    .btn-group {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .btn-safe {
      background-color: #3182ce;
      color: #fff;
      padding: 12px 20px;
      border: none;
      border-radius: 6px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }
    .btn-safe:hover {
      background-color: #2b6cb0;
    }
    .btn-bypass {
      background: transparent;
      color: #a0aec0;
      border: none;
      font-size: 13px;
      cursor: pointer;
      text-decoration: underline;
      margin-top: 6px;
    }
    .btn-bypass:hover {
      color: #e2e8f0;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">🚨</div>
    <h1>Situs Berbahaya Diblokir</h1>
    <p>PhishShield mendeteksi bahwa tautan ini terindikasi sebagai <strong>situs phishing</strong> yang berpotensi mencuri data kredensial atau informasi sensitif Anda.</p>
    
    <div class="target-url" id="blocked-domain">Memuat URL...</div>

    <div class="btn-group">
      <button class="btn-safe" id="btn-back">Kembali ke Tempat Aman</button>
      <button class="btn-bypass" id="btn-proceed">Saya mengerti risikonya, tetap lanjutkan</button>
    </div>
  </div>

  <script src="blocked.js"></script>
</body>
</html>
